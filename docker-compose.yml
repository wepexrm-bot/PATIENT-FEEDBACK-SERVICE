services:
  ingestion-api:
    build:
      context: .
      dockerfile: ingestion-api/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      pii-sanitizer:
        condition: service_healthy
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  pii-sanitizer:
    build:
      context: .
      dockerfile: pii-sanitizer/Dockerfile
    expose:
      - "8001"
    depends_on:
      governance-service:
        condition: service_healthy
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  sentiment-model:
    build:
      context: .
      dockerfile: sentiment-model/Dockerfile
    expose:
      - "8002"
    depends_on:
      governance-service:
        condition: service_healthy
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  governance-service:
    build:
      context: .
      dockerfile: governance-service/Dockerfile
    ports:
      - "8010:8010"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata: