services:
  ingestion-api:
    image: ghcr.io/${GITHUB_REPO_OWNER}/patient-feedback-ingestion-api:${IMAGE_TAG}
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      pii-sanitizer:
        condition: service_healthy
    env_file: .env
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  pii-sanitizer:
    image: ghcr.io/${GITHUB_REPO_OWNER}/patient-feedback-pii-sanitizer:${IMAGE_TAG}
    restart: always
    expose:
      - "8001"
    depends_on:
      governance-service:
        condition: service_healthy
    env_file: .env
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  sentiment-model:
    image: ghcr.io/${GITHUB_REPO_OWNER}/patient-feedback-sentiment-model:${IMAGE_TAG}
    restart: always
    expose:
      - "8002"
    depends_on:
      governance-service:
        condition: service_healthy
    env_file: .env
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  governance-service:
    image: ghcr.io/${GITHUB_REPO_OWNER}/patient-feedback-governance-service:${IMAGE_TAG}
    restart: always
    ports:
      - "8010:8010"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  streamlit-ui:
    image: ghcr.io/${GITHUB_REPO_OWNER}/patient-feedback-streamlit-ui:${IMAGE_TAG}
    restart: always
    ports:
      - "8501:8501"
    depends_on:
      ingestion-api:
        condition: service_healthy
      governance-service:
        condition: service_healthy
    env_file: .env
    environment:
      - INGESTION_API_URL=http://ingestion-api:8000
      - GOVERNANCE_API_URL=http://governance-service:8010
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    restart: always
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file: .env
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - streamlit-ui
      - ingestion-api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
